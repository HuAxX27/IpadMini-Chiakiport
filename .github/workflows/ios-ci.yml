# iOS CI workflow (A1.5)
#
# Runs on every PR (any branch) and every push to main, whatever it touches:
#
#   - ipad: builds for the iPad mini 1 (armv7, iOS 9.0, SDK 9.3) with the
#     toolchain from ios/toolchain/install-theos.sh. ci-ipad.sh checks the
#     contracts for armv7, builds the core with mbedTLS and Opus, and packages
#     every Theos project under ios/ as a .deb. Artifacts: "ipad-debs" (the
#     .deb files to install on the iPad) and "ios-libs-armv7" (the static
#     libraries, headers and licenses).
#   - linux-tests: the port's portable C tests on Linux, on x86_64 and as
#     32-bit ARM under qemu-arm: the contracts, the core (ios/tests/core),
#     H.264 (A3) and input (A5: the DualSense parser and the BTServer filter).
#   - publish: puts the .debs of "ipad" in a public pre-release, ipad-main for
#     main and ipad-pr-<N> for PR N (ios/toolchain/publish-debs.sh), which a PC
#     downloads without signing in to GitHub, as artifacts need
#     (ios/toolchain/fetch-debs.ps1). ios-debs-cleanup.yml deletes a PR's
#     pre-release when the PR closes.
#
# ios-quality.yml adds secrets, private data, static analysis and lint.
#
# The toolchain itself (Docker image, install script) is checked by
# ios-toolchain.yml when it changes. The iOS SDK is downloaded at build time
# and never uploaded.

name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: the iPad build
  # ---------------------------------------------------------------------------
  ipad:
    name: iPad build (armv7, iOS 9)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fakeroot rsync libtinfo6 cmake ninja-build protobuf-compiler python3-protobuf

      - name: Install Theos, toolchain and SDK
        run: THEOS="$RUNNER_TEMP/theos" ios/toolchain/install-theos.sh

      - name: Contracts, core and packages for the iPad
        run: THEOS="$RUNNER_TEMP/theos" ios/toolchain/ci-ipad.sh

      - name: Upload the .deb packages
        uses: actions/upload-artifact@v4
        with:
          name: ipad-debs
          path: build-ios-ci/debs/*.deb
          if-no-files-found: error

      - name: Upload the armv7 libraries
        uses: actions/upload-artifact@v4
        with:
          name: ios-libs-armv7
          path: build-ios-ci/libs-armv7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 2: Linux tests
  # Each suite is its own step so a failure names the suite.
  # ---------------------------------------------------------------------------
  linux-tests:
    name: Linux tests (x86_64 and armv7 under qemu)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install test dependencies (host and armhf)
        run: sudo ios/toolchain/apt-linux-tests.sh

      - name: Contracts
        run: cc -std=c11 -fsyntax-only -Ilib/include -Iios -Ibridge/protocol ios/tests/contracts_check.c

      # THEOS is not set here, so the script skips its Theos step: the iPad
      # job packages ckdirect with the rest of ios/.
      - name: Input, DualSense parser and BTServer filter (A5)
        run: ios/tests/input_tests.sh

      - name: H.264 Annex B to AVCC (A3)
        run: ios/tests/ck_h264_tests.sh

      - name: Core with OpenSSL, mbedTLS and armv7 mbedTLS (A2)
        run: ios/tests/core/run.sh

  # ---------------------------------------------------------------------------
  # Job 3: the .debs as a public pre-release
  # Only main and PRs from this repo: a fork's token cannot write releases.
  # One run at a time per pre-release; a run whose commit is no longer the
  # latest of main or of the PR publishes nothing (publish-debs.sh).
  # ---------------------------------------------------------------------------
  publish:
    name: Publish the .debs (pre-release)
    needs: ipad
    if: >-
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: ipad-debs-${{ github.event.pull_request.number || 'main' }}
      cancel-in-progress: false

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download the .deb packages
        uses: actions/download-artifact@v4
        with:
          name: ipad-debs
          path: ${{ runner.temp }}/debs

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.event.pull_request.number || 'main' }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ios/toolchain/publish-debs.sh "$SOURCE" "$COMMIT" "$RUNNER_TEMP/debs"
